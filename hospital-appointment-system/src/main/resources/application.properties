spring.application.name=hospital-appointment-system

# ---- MySQL ----
# Reads from environment variables if present (used on Render), otherwise
# falls back to localhost defaults for running on your own machine.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Bikram@06}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Server ----
# Render injects its own PORT env var; fall back to 8080 for local runs
server.port=${PORT:8080}

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:replaceThisWithALongRandomBase64EncodedSecretKeyForJWTSigning123456789}
app.jwt.expiration-ms=86400000

# ---- Scheduling ----
spring.task.scheduling.pool.size=2
